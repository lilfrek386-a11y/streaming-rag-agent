[project]
name = "ai-internship"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "black>=26.5.1",
    "faiss-cpu>=1.15.0",
    "fastapi[standard]>=0.140.9",
    "langchain-text-splitters>=1.1.2",
    "mypy>=2.3.0",
    "numpy>=2.5.2",
    "openai>=2.50.0",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "sentence-transformers>=5.7.0",
    "tenacity>=9.1.4",
    "tiktoken>=0.13.0",
    "wikipedia>=1.4.0",
]

[[tool.mypy.overrides]]
module = "src.core.settings"
disable_error_code = ["call-arg"]

[[tool.mypy.overrides]]
module = "wikipedia.*"
ignore_missing_imports = true
