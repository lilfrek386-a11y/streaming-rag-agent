[project]
name = "ai-internship"
version = "0.1.0"
description = "Multi-turn CLI chat with streaming, tool calling, RAG, and voice capabilities"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "elevenlabs>=1.0.0",
    "faiss-cpu>=1.8.0",
    "langchain-text-splitters>=0.2.0",
    "numpy>=1.26.0",
    "openai>=1.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "rich>=13.7.0",
    "sentence-transformers>=3.0.0",
    "tenacity>=8.3.0",
    "tiktoken>=0.7.0",
]

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "BLE", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"
